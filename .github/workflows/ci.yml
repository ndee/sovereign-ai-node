name: CI

on:
  pull_request:
    branches: [main]
    # ready_for_review is included so the installer e2e jobs (skipped on
    # drafts) run the moment a PR is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr_title:
    name: PR Title (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            ci
            test
            refactor
            perf
            build
            style
          scopes: |
            release
            installer
            cli
            api
            matrix
            openclaw
            bots
            contracts
            onboarding
            relay
            e2e
            deps
            setup-ui
          requireScope: false

  # Path awareness keeps the installer e2e jobs (~20 job-minutes, plus the upgrade) off
  # draft or install-irrelevant pull requests. Every main push runs all of them:
  # a successful CI workflow is the release publication gate, so none of its
  # installer coverage may be skipped on a release-capable commit.
  changes:
    name: Detect install-relevant changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      install_relevant: ${{ steps.filter.outputs.install_relevant }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            install_relevant:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!**/*.test.ts'
              - '!**/__tests__/**'
              - '!.github/**'
              - '.github/workflows/ci.yml'
              - '!LICENSE'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Unit Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage:unit

  integration_coverage:
    name: Integration Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage:integration

  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Hosted in a REQUIRED check on purpose: "Smoke Tests" is one of the
      # contexts the ruleset enforces, so a change that breaks the auto-merge
      # guard cannot itself be auto-merged.
      - name: Verify release-PR auto-merge cannot bypass required checks
        run: bash scripts/release/test-auto-merge-release-pr.sh

      - name: CLI --help exits cleanly
        run: pnpm dev:cli --help

      - name: sovereign-tool reports a verifiable version
        # sovereign-tool is a REQUIRED product dependency (a past install regression);
        # `--version` must work so a deployed binary's identity is checkable.
        run: |
          VERSION="$(pnpm --silent dev:tool --version)"
          echo "sovereign-tool --version => $VERSION"
          test -n "$VERSION"
          test "$VERSION" != "unknown"

      - name: package.json bin ↔ installer wrapper parity
        # Fails if a bin entry lacks a /usr/local/bin wrapper in
        # scripts/install/lib-build.sh or the exec targets drift (past install regression).
        run: bash scripts/ci/test-wrapper-bin-parity.sh

      - name: Install E2E jobs pre-pull the pinned Synapse image
        run: bash scripts/ci/test-synapse-prepull.sh

      - name: API starts and responds on /healthz
        run: |
          pnpm dev:api &
          API_PID=$!

          # wait for the server to be ready (up to 10s)
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8787/healthz > /dev/null 2>&1; then
              echo "API healthy after ~$((i / 2))s"
              break
            fi
            sleep 0.5
          done

          curl -sf http://127.0.0.1:8787/healthz | grep '"ok":true'
          kill $API_PID

  artifact_contract:
    name: Release Artifact Contract
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Verify prebuilt Node installer artifact
        run: bash scripts/ci/test-prebuilt-node-artifact.sh

      - name: Verify prebuilt Bots installer artifact
        run: bash scripts/ci/test-prebuilt-bots-artifact.sh

      - name: Verify draft-aware GitHub Release lookup
        run: bash scripts/release/test-find-github-release.sh

      - name: Verify CI-gated release publication
        run: bash scripts/release/test-release-workflow-gate.sh

      - name: Verify a release is only created for the validated main
        run: bash scripts/release/test-check-pending-release-pr.sh

      - name: Build and test exact Node release assets
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          ARTIFACT_DIR="$RUNNER_TEMP/sovereign-node-release"
          bash scripts/release/build-node-artifacts.sh "$ARTIFACT_DIR"
          bash scripts/release/test-node-artifacts.sh "$ARTIFACT_DIR"

  # The installer runs the host-resources playbook with the host's own
  # ansible-core, which is the distro package on a fresh host. The install
  # E2Es run on whatever the runner image ships (2.21 today), and ansible-core
  # up to 2.18 templates JSON-looking values differently, so the playbook also
  # runs here, unchanged, on each distro's packaged ansible-core.
  host_resources_ansible:
    name: Host Resources Playbook (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: ${{ matrix.image }}
    env:
      LC_ALL: C.UTF-8
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Debian 12 ansible-core 2.14
            image: debian:12
            expect: "2.14."
          - label: Ubuntu 24.04 ansible-core 2.16
            image: ubuntu:24.04
            expect: "2.16."
          - label: Debian 13 ansible-core 2.19
            image: debian:13
            expect: "2.19."
          # No supported distro packages 2.17 or 2.18; 2.18 is the last
          # release with the old templating.
          - label: pip ansible-core 2.18
            image: python:3.12-slim
            pip: ansible-core==2.18.*
            expect: "2.18."
    steps:
      - uses: actions/checkout@v4
      - name: Install ansible-core
        env:
          PIP_SPEC: ${{ matrix.pip }}
        run: |
          if [ -n "$PIP_SPEC" ]; then
            pip install --quiet "$PIP_SPEC"
          else
            apt-get update -y
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ansible-core
          fi
      - name: Confirm the ansible-core under test
        env:
          EXPECT: ${{ matrix.expect }}
        run: ansible-playbook --version | head -n 1 | grep -F "core $EXPECT"
      - name: Run the host-resources playbook against stubbed host commands
        run: bash scripts/ci/test-host-resources-ansible.sh

  e2e_noninteractive:
    name: E2E Install (non-interactive)
    # The gateway runs on the host's system Node, which must be inside the
    # supported >=22.22.3 <23 range; ubuntu-latest (26.04) ships Node 24 there.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [test, changes]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (needs.changes.outputs.install_relevant == 'true' &&
       github.event.pull_request.draft == false)
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Clone bot catalog repo
        run: |
          BOT_REF="${GITHUB_HEAD_REF:-main}"
          if git ls-remote --exit-code --heads https://github.com/ndee/sovereign-ai-bots "$BOT_REF" >/dev/null 2>&1; then
            git clone --depth 1 --branch "$BOT_REF" https://github.com/ndee/sovereign-ai-bots /tmp/sovereign-ai-bots
          else
            git clone --depth 1 https://github.com/ndee/sovereign-ai-bots /tmp/sovereign-ai-bots
          fi

      # Warm the cache with the image the product pins, read from its source.
      - name: Pre-pull Docker images
        run: |
          synapse_image="$(bash scripts/e2e/synapse-upgrade-e2e.sh expected-image src/system/matrix.ts)"
          docker pull postgres:16-alpine &
          docker pull "$synapse_image" &
          wait

      # A fresh Ubuntu 24.04 host has no Ansible, so the installer apt-installs
      # the distro's ansible-core (2.16). The runner image ships a newer one
      # through pipx; removing it puts this install on the customer's path.
      - name: Remove the runner's preinstalled Ansible
        run: |
          sudo env "PATH=$PATH" PIPX_HOME=/opt/pipx PIPX_BIN_DIR=/opt/pipx_bin \
            pipx uninstall ansible-core || true
          sudo rm -f /opt/pipx_bin/ansible*
          hash -r
          if command -v ansible-playbook; then
            echo "::error::ansible-playbook is still on PATH"
            exit 1
          fi

      - name: Run full installer (install.sh, non-interactive)
        run: |
          cp test/fixtures/ci-install-request.json /tmp/ci-install-request.json

          sudo env "PATH=$PATH" bash scripts/install.sh \
            --source-dir "$GITHUB_WORKSPACE" \
            --bots-source-dir /tmp/sovereign-ai-bots \
            --request-file /tmp/ci-install-request.json \
            --install \
            --non-interactive

          jq -e '
            .connectivity.mode == "direct"
            and .matrix.publicBaseUrl == "http://127.0.0.1:8008"
            and .matrix.alertRoomName == "CI Alerts"
            and .operator.username == "operator"
          ' /tmp/ci-install-request.json > /dev/null
        timeout-minutes: 15

      - name: Verify the install ran on the distro's ansible-core
        run: |
          dpkg-query -W ansible-core
          ansible-playbook --version | head -n 1 | grep -F "core 2.16."

      - name: Verify Matrix is reachable
        run: |
          curl -f --retry 3 --retry-delay 2 http://127.0.0.1:8008/_matrix/client/versions | jq .

      - name: Verify operator account exists
        run: |
          curl -f --retry 3 --retry-delay 2 http://127.0.0.1:8008/_matrix/client/v3/login | jq .

      # OpenClaw 2026.8 keeps its state in SQLite under the service home; a
      # root-created entry there stops the gateway.
      - name: Verify the OpenClaw state belongs to the service user
        run: sudo env "PATH=$PATH" bash scripts/ci/verify-openclaw-state-ownership.sh

      # Secrets must not travel in the process arguments of privileged calls:
      # sudo records those, so they would surface in the journal.
      - name: Verify no install credential is in a log or job record
        run: sudo env "PATH=$PATH" bash scripts/ci/verify-no-credential-residue.sh

      # The service user reaches root only through the installed sudoers
      # fragment and the root-owned helpers, and not through the docker group.
      - name: Verify the service user's privileges and helpers
        run: sudo env "PATH=$PATH" bash scripts/ci/verify-service-privileges.sh

      # Issue #235: a fresh install left mail-sentinel/workspace/data root-owned,
      # so the first scan (User=sovereign-node) died with EACCES on its state
      # lock until a later --update re-chowned the state dir.
      - name: Verify bot state is owned by the service user and the first scan runs
        run: |
          state_dir=/var/lib/sovereign-node/mail-sentinel
          sudo test -d "$state_dir/workspace/data"
          not_owned="$(sudo find "$state_dir" ! -user sovereign-node)"
          if [ -n "$not_owned" ]; then
            echo "::error::Not owned by sovereign-node after a fresh install:"
            echo "$not_owned"
            exit 1
          fi

          since="$(date '+%Y-%m-%d %H:%M:%S')"
          scan_rc=0
          sudo systemctl start sovereign-mail-sentinel-scan.service || scan_rc=$?
          journal="$(sudo journalctl -u sovereign-mail-sentinel-scan.service --since "$since" --no-pager)"
          echo "$journal"
          if grep -q 'EACCES' <<<"$journal"; then
            echo "::error::Mail Sentinel scan hit EACCES"
            exit 1
          fi
          if [ "$scan_rc" -ne 0 ]; then
            echo "::error::sovereign-mail-sentinel-scan.service failed (exit $scan_rc)"
            exit 1
          fi

      # The install job and status must agree with an independent look at the
      # gateway port instead of reporting success while it does not listen.
      - name: Verify reported gateway readiness matches the gateway port
        run: |
          job="$(sudo sh -c 'ls -t /var/lib/sovereign-node/install-jobs/*.json | head -n 1')"
          sudo jq '{state: .response.job.state, gateway: .response.gateway, step: (.response.job.steps[] | select(.id == "gateway_ready"))}' "$job"
          sudo jq -e '
            .response.job.state == "succeeded"
            and .response.gateway.ready == true
            and ([.response.job.steps[] | select(.id == "gateway_ready" and .state == "succeeded")] | length) == 1
          ' "$job" > /dev/null
          curl -s -o /dev/null --max-time 5 http://127.0.0.1:18789/
          sudo env "PATH=$PATH" sovereign-node status --json > /tmp/status.json
          jq -e '.result.services[] | select(.kind == "openclaw") | .readiness == "ready"' /tmp/status.json

      # The bots authenticate their /tools/invoke calls with the token in the
      # rendered OpenClaw config. A gateway that generated its own runtime-only
      # token rejects every one of them, and nothing else in this job notices.
      - name: Verify the gateway accepts only the token in the rendered config
        run: sudo env "PATH=$PATH" GITHUB_ACTIONS="$GITHUB_ACTIONS" bash scripts/ci/verify-gateway-auth.sh check

      # Checked from inside the units' mount namespaces: no new privileges, no
      # capabilities, a read-only system, no container-runtime socket and only
      # the programs each unit needs.
      - name: Verify the gateway and scan units run inside their systemd sandbox
        run: sudo env "PATH=$PATH" bash scripts/ci/verify-systemd-sandbox.sh

      # The plugin command answers from the bot's CLI on the agent's own Matrix
      # account, so it keeps working while the chat model is unavailable.
      - name: Verify /version answers through the typed-tool plugin without a model
        run: sudo env "PATH=$PATH" bash scripts/ci/verify-typed-tool-slash-command.sh

      # A gateway that is up but never listens must be reported as not ready
      # (warn, exit 0 for this command) rather than as restarted. The drop-in
      # keeps the unit active without ever opening the port; it adds sleep to
      # the unit's ExecPaths= allow-list, which refuses any other program.
      - name: Verify a gateway that never listens is reported as not ready
        run: |
          dropin=/etc/systemd/system/sovereign-openclaw-gateway.service.d
          sudo mkdir -p "$dropin"
          printf '[Service]\nExecPaths=/usr/bin/sleep\nExecStart=\nExecStart=/usr/bin/sleep 600\n' | sudo tee "$dropin/ci-never-listens.conf" > /dev/null
          rc=0
          sudo env "PATH=$PATH" SOVEREIGN_NODE_GATEWAY_READY_TIMEOUT_MS=30000 \
            sovereign-node reconfigure openrouter --model openrouter/ci-not-ready-probe --json \
            > /tmp/reconfigure.json || rc=$?
          jq . /tmp/reconfigure.json
          test "$rc" -eq 0
          jq -e '
            .result.gateway.ready == false
            and .result.gateway.deadlineMs == 30000
            and ([.result.validation[] | select(.id == "openclaw-gateway-restart" and .status == "warn")] | length) == 1
          ' /tmp/reconfigure.json > /dev/null
          sudo env "PATH=$PATH" sovereign-node status --json > /tmp/status.json
          jq -e '.result.services[] | select(.kind == "openclaw") | .readiness == "starting"' /tmp/status.json

          sudo rm -f "$dropin/ci-never-listens.conf"
          sudo systemctl daemon-reload
          sudo systemctl restart sovereign-openclaw-gateway.service
          for _ in $(seq 1 60); do
            curl -s -o /dev/null --max-time 2 http://127.0.0.1:18789/ && exit 0
            sleep 2
          done
          echo "::error::gateway did not listen again after removing the drop-in"
          exit 1

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== request file ==="
          cat /tmp/ci-install-request.json 2>/dev/null | jq . || true
          echo "=== sovereign-node status ==="
          sudo env "PATH=$PATH" sovereign-node status --json 2>&1 || true
          echo "=== gateway and scan units ==="
          sudo cat /etc/systemd/system/sovereign-openclaw-gateway.service 2>/dev/null || true
          sudo cat /etc/systemd/system/sovereign-mail-sentinel-scan.service 2>/dev/null || true
          sudo systemctl status --no-pager sovereign-openclaw-gateway.service 2>&1 || true
          sudo journalctl -u sovereign-openclaw-gateway.service -n 300 --no-pager 2>&1 || true
          sudo journalctl -u sovereign-mail-sentinel-scan.service -n 100 --no-pager 2>&1 || true
          echo "=== OpenClaw home ownership ==="
          sudo find /var/lib/sovereign-node/openclaw-home -maxdepth 3 -printf '%u:%g %m %TY-%Tm-%TdT%TH:%TM:%TS %p\n' 2>&1 | sort -k3 || true
          echo "=== docker compose logs ==="
          COMPOSE_DIR=$(find /etc/sovereign-node -name compose.yaml -exec dirname {} \; 2>/dev/null | head -1)
          if [ -n "$COMPOSE_DIR" ]; then
            cd "$COMPOSE_DIR" && docker compose logs --tail=100 2>&1 || true
          fi

  e2e_interactive:
    name: E2E Install (interactive)
    # The gateway runs on the host's system Node, which must be inside the
    # supported >=22.22.3 <23 range; ubuntu-latest (26.04) ships Node 24 there.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    needs: [test, changes]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (needs.changes.outputs.install_relevant == 'true' &&
       github.event.pull_request.draft == false)
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Clone bot catalog repo
        run: |
          BOT_REF="${GITHUB_HEAD_REF:-main}"
          if git ls-remote --exit-code --heads https://github.com/ndee/sovereign-ai-bots "$BOT_REF" >/dev/null 2>&1; then
            git clone --depth 1 --branch "$BOT_REF" https://github.com/ndee/sovereign-ai-bots /tmp/sovereign-ai-bots
          else
            git clone --depth 1 https://github.com/ndee/sovereign-ai-bots /tmp/sovereign-ai-bots
          fi

      # Warm the cache with the image the product pins, read from its source.
      - name: Pre-pull Docker images
        run: |
          synapse_image="$(bash scripts/e2e/synapse-upgrade-e2e.sh expected-image src/system/matrix.ts)"
          docker pull postgres:16-alpine &
          docker pull "$synapse_image" &
          wait

      - name: Run full installer (install.sh, interactive)
        run: |
          python3 scripts/ci-drive-interactive-installer.py \
            --source-dir "$GITHUB_WORKSPACE" \
            --bots-source-dir /tmp/sovereign-ai-bots \
            --transcript /tmp/ci-interactive-transcript.log \
            --idle-timeout-seconds 180 \
            --overall-timeout-seconds 1800

          # The interactive driver now accepts the default bot selection
          # rather than sending "a" (select all). Assert mail-sentinel is
          # present (the only defaultInstall: true bot in sovereign-ai-bots
          # today) instead of pinning the exact list — new default bots
          # should land without workflow churn, and the explicit "all"
          # coverage lives in a follow-up job once non-default bots support
          # clean interactive-install paths.
          sudo jq -e '
            .connectivity.mode == "direct"
            and .matrix.publicBaseUrl == "http://127.0.0.1:8008"
            and .matrix.alertRoomName == "Alerts"
            and .operator.username == "admin"
            and (.bots.selected | index("mail-sentinel"))
          ' /etc/sovereign-node/install-request.json > /dev/null
        timeout-minutes: 30

      - name: Verify Matrix is reachable
        run: |
          curl -f --retry 3 --retry-delay 2 http://127.0.0.1:8008/_matrix/client/versions | jq .

      - name: Verify operator account exists
        run: |
          curl -f --retry 3 --retry-delay 2 http://127.0.0.1:8008/_matrix/client/v3/login | jq .

      # OpenClaw 2026.8 keeps its state in SQLite under the service home; a
      # root-created entry there stops the gateway.
      - name: Verify the OpenClaw state belongs to the service user
        run: sudo env "PATH=$PATH" bash scripts/ci/verify-openclaw-state-ownership.sh

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== interactive transcript ==="
          cat /tmp/ci-interactive-transcript.log 2>/dev/null || true
          echo "=== request file ==="
          sudo cat /etc/sovereign-node/install-request.json 2>/dev/null | jq . || true
          echo "=== sovereign-node status ==="
          sudo env "PATH=$PATH" sovereign-node status --json 2>&1 || true
          echo "=== gateway and scan units ==="
          sudo cat /etc/systemd/system/sovereign-openclaw-gateway.service 2>/dev/null || true
          sudo cat /etc/systemd/system/sovereign-mail-sentinel-scan.service 2>/dev/null || true
          sudo systemctl status --no-pager sovereign-openclaw-gateway.service 2>&1 || true
          sudo journalctl -u sovereign-openclaw-gateway.service -n 300 --no-pager 2>&1 || true
          sudo journalctl -u sovereign-mail-sentinel-scan.service -n 100 --no-pager 2>&1 || true
          echo "=== OpenClaw home ownership ==="
          sudo find /var/lib/sovereign-node/openclaw-home -maxdepth 3 -printf '%u:%g %m %TY-%Tm-%TdT%TH:%TM:%TS %p\n' 2>&1 | sort -k3 || true
          echo "=== docker compose logs ==="
          COMPOSE_DIR=$(find /etc/sovereign-node -name compose.yaml -exec dirname {} \; 2>/dev/null | head -1)
          if [ -n "$COMPOSE_DIR" ]; then
            cd "$COMPOSE_DIR" && docker compose logs --tail=100 2>&1 || true
          fi

  e2e_rerun_after_partial_failure:
    name: E2E Install (rerun after partial failure)
    # The gateway runs on the host's system Node, which must be inside the
    # supported >=22.22.3 <23 range; ubuntu-latest (26.04) ships Node 24 there.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [test, changes]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (needs.changes.outputs.install_relevant == 'true' &&
       github.event.pull_request.draft == false)
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Clone bot catalog repo
        run: |
          BOT_REF="${GITHUB_HEAD_REF:-main}"
          if git ls-remote --exit-code --heads https://github.com/ndee/sovereign-ai-bots "$BOT_REF" >/dev/null 2>&1; then
            git clone --depth 1 --branch "$BOT_REF" https://github.com/ndee/sovereign-ai-bots /tmp/sovereign-ai-bots
          else
            git clone --depth 1 https://github.com/ndee/sovereign-ai-bots /tmp/sovereign-ai-bots
          fi

      # Warm the cache with the image the product pins, read from its source.
      - name: Pre-pull Docker images
        run: |
          synapse_image="$(bash scripts/e2e/synapse-upgrade-e2e.sh expected-image src/system/matrix.ts)"
          docker pull postgres:16-alpine &
          docker pull "$synapse_image" &
          wait

      # Reproduce issue #179: a leftover install from a *different* compose
      # project squats on 127.0.0.1:8008 before the new install runs.
      - name: Seed a leftover foreign Matrix project on the install port
        run: |
          mkdir -p /tmp/foreign-synapse
          cp test/fixtures/foreign-synapse-compose.yaml /tmp/foreign-synapse/compose.yaml
          docker compose -p pipi2-sovereign-ai-node-com \
            -f /tmp/foreign-synapse/compose.yaml up -d

          # Wait until the foreign server actually answers AND its server_name is
          # the foreign one. If it never comes up, fail the SEED step loudly rather
          # than letting the install silently succeed on a free port (that would be
          # a broken test, not a passing fix).
          ok=
          for i in $(seq 1 60); do
            name="$(curl -fs http://127.0.0.1:8008/_matrix/key/v2/server 2>/dev/null | jq -r '.server_name // empty')"
            if [ "$name" = "foreign.local.test" ]; then
              echo "Foreign server is up and holding 127.0.0.1:8008 (server_name=$name)"
              ok=1
              break
            fi
            sleep 2
          done
          ss -tlnp | grep ':8008' || true
          docker ps --filter publish=8008 --format '{{.Names}}\t{{.Label "com.docker.compose.project"}}'
          if [ -z "$ok" ]; then
            echo "::error::Foreign squatter never came up on 127.0.0.1:8008 — test fixture broken, cannot reproduce #179"
            docker compose -p pipi2-sovereign-ai-node-com -f /tmp/foreign-synapse/compose.yaml logs --tail=50 || true
            exit 1
          fi

      - name: Run installer and assert it fails fast with a port-conflict error
        run: |
          cp test/fixtures/ci-install-request.json /tmp/ci-install-request.json

          set +e
          OUT="$(sudo env "PATH=$PATH" bash scripts/install.sh \
            --source-dir "$GITHUB_WORKSPACE" \
            --bots-source-dir /tmp/sovereign-ai-bots \
            --request-file /tmp/ci-install-request.json \
            --install \
            --non-interactive 2>&1)"
          STATUS=$?
          set -e

          echo "$OUT"
          echo "installer exit code: $STATUS"

          # The install MUST fail (non-zero) ...
          if [ "$STATUS" -eq 0 ]; then
            echo "::error::Install unexpectedly succeeded while a foreign Synapse owned the port"
            exit 1
          fi
          # ... and it MUST be the actionable port-conflict / foreign-Synapse error,
          # NOT the old MATRIX_LOGIN_FAILED 500 against the wrong homeserver.
          if echo "$OUT" | grep -qE 'BUNDLED_MATRIX_PORT_CONFLICT|MATRIX_FOREIGN_SYNAPSE_ON_PORT'; then
            echo "Install correctly reported a cross-project port conflict."
          else
            echo "::error::Install failed, but not with the expected port-conflict error code"
            echo "$OUT" | grep -iE 'MATRIX_LOGIN_FAILED|M_UNKNOWN' && \
              echo "::error::Saw the pre-fix MATRIX_LOGIN_FAILED symptom — issue #179 not fixed"
            exit 1
          fi
        timeout-minutes: 15

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== foreign synapse logs ==="
          docker compose -p pipi2-sovereign-ai-node-com -f /tmp/foreign-synapse/compose.yaml logs --tail=100 2>&1 || true
          echo "=== docker ps -a ==="
          docker ps -a || true
          echo "=== request file ==="
          cat /tmp/ci-install-request.json 2>/dev/null | jq . || true

  # The setup web UI path: install.sh only bootstraps the host, and the install
  # job runs in-process inside sovereign-node-api.service as the unprivileged
  # service user. That is a system service with no login session, so there is
  # no systemd user bus. The root CLI installs above never take this path.
  e2e_web_install:
    name: E2E Install (non-root web install)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [test, changes]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (needs.changes.outputs.install_relevant == 'true' &&
       github.event.pull_request.draft == false)
    env:
      WEB_E2E: scripts/e2e/web-install-e2e.sh
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Clone bot catalog repo
        run: |
          BOT_REF="${GITHUB_HEAD_REF:-main}"
          if git ls-remote --exit-code --heads https://github.com/ndee/sovereign-ai-bots "$BOT_REF" >/dev/null 2>&1; then
            git clone --depth 1 --branch "$BOT_REF" https://github.com/ndee/sovereign-ai-bots /tmp/sovereign-ai-bots
          else
            git clone --depth 1 https://github.com/ndee/sovereign-ai-bots /tmp/sovereign-ai-bots
          fi

      - name: Pre-pull Docker images
        run: |
          synapse_image="$(bash scripts/e2e/synapse-upgrade-e2e.sh expected-image src/system/matrix.ts)"
          docker pull postgres:16-alpine &
          docker pull "$synapse_image" &
          wait

      - name: Bootstrap the host only (install.sh --skip-install-run)
        run: |
          cp test/fixtures/ci-install-request.json /tmp/ci-install-request.json
          sudo env "PATH=$PATH" bash scripts/install.sh \
            --source-dir "$GITHUB_WORKSPACE" \
            --bots-source-dir /tmp/sovereign-ai-bots \
            --request-file /tmp/ci-install-request.json \
            --install \
            --non-interactive \
            --skip-install-run
        timeout-minutes: 10

      - name: Verify the API runs unprivileged with no systemd user bus
        run: sudo bash "$WEB_E2E" assert-no-user-bus

      - name: Run the install through the setup API
        run: sudo env "PATH=$PATH" bash "$WEB_E2E" run /tmp/ci-install-request.json /tmp/web-install-job.json
        timeout-minutes: 16

      - name: Verify Matrix is reachable
        run: |
          curl -f --retry 3 --retry-delay 2 http://127.0.0.1:8008/_matrix/client/versions | jq .

      - name: Verify reported gateway readiness matches the gateway port
        run: |
          jq -e '
            .result.job.state == "succeeded"
            and .result.gateway.ready == true
            and ([.result.job.steps[] | select(.id == "gateway_ready" and .state == "succeeded")] | length) == 1
          ' /tmp/web-install-job.json > /dev/null
          curl -s -o /dev/null --max-time 5 http://127.0.0.1:18789/
          sudo env "PATH=$PATH" sovereign-node status --json > /tmp/status.json
          jq -e '.result.services[] | select(.kind == "openclaw") | .readiness == "ready"' /tmp/status.json
          systemctl is-active sovereign-openclaw-gateway.service
          test "$(systemctl show -p User --value sovereign-openclaw-gateway.service)" = sovereign-node

      # This path never runs `openclaw gateway install`, the only OpenClaw 2026.8
      # command that writes a gateway token into the config.
      - name: Verify the gateway accepts only the token in the rendered config
        run: |
          sudo env "PATH=$PATH" GITHUB_ACTIONS="$GITHUB_ACTIONS" bash scripts/ci/verify-gateway-auth.sh record /tmp/gateway-token.sha256
          sudo env "PATH=$PATH" GITHUB_ACTIONS="$GITHUB_ACTIONS" bash scripts/ci/verify-gateway-auth.sh check

      - name: Verify the OpenClaw state belongs to the service user
        run: sudo env "PATH=$PATH" bash scripts/ci/verify-openclaw-state-ownership.sh

      - name: Verify no install credential is in a log or job record
        run: sudo env "PATH=$PATH" bash scripts/ci/verify-no-credential-residue.sh

      - name: Verify the service user's privileges and helpers
        run: sudo env "PATH=$PATH" bash scripts/ci/verify-service-privileges.sh

      - name: Verify bot state is owned by the service user and the Mail Sentinel scan runs
        run: |
          state_dir=/var/lib/sovereign-node/mail-sentinel
          sudo test -d "$state_dir/workspace/data"
          not_owned="$(sudo find "$state_dir" ! -user sovereign-node)"
          if [ -n "$not_owned" ]; then
            echo "::error::Not owned by sovereign-node after the API install:"
            echo "$not_owned"
            exit 1
          fi

          since="$(date '+%Y-%m-%d %H:%M:%S')"
          scan_rc=0
          sudo systemctl start sovereign-mail-sentinel-scan.service || scan_rc=$?
          journal="$(sudo journalctl -u sovereign-mail-sentinel-scan.service --since "$since" --no-pager)"
          echo "$journal"
          if grep -q 'EACCES' <<<"$journal"; then
            echo "::error::Mail Sentinel scan hit EACCES"
            exit 1
          fi
          if [ "$scan_rc" -ne 0 ]; then
            echo "::error::sovereign-mail-sentinel-scan.service failed (exit $scan_rc)"
            exit 1
          fi

      - name: Verify the gateway and scan units run inside their systemd sandbox
        run: sudo env "PATH=$PATH" bash scripts/ci/verify-systemd-sandbox.sh

      # A second run in the same API process finds the system gateway unit
      # installed. OpenClaw's doctor repairs its state only while that gateway
      # is stopped, so the service user must be able to stop it.
      - name: Re-run the install through the setup API on the installed node
        run: |
          since="$(date '+%Y-%m-%d %H:%M:%S')"
          sudo env "PATH=$PATH" bash "$WEB_E2E" run /tmp/ci-install-request.json /tmp/web-install-job.json
          if sudo journalctl -u sovereign-node-api.service --since "$since" --no-pager | grep 'Could not stop the OpenClaw gateway'; then
            echo "::error::the install could not stop the gateway before the OpenClaw config repair"
            exit 1
          fi
          # The first install points the API's HOME at the OpenClaw home; the
          # second must keep using the OpenClaw the first one installed.
          if sudo test -e /var/lib/sovereign-node/openclaw-home/.npm-global; then
            echo "::error::the second install put another OpenClaw under the OpenClaw home"
            sudo ls -la /var/lib/sovereign-node/openclaw-home/.npm-global
            exit 1
          fi
          jq -e '.result.gateway.ready == true' /tmp/web-install-job.json > /dev/null
          curl -s -o /dev/null --max-time 5 --retry 10 --retry-connrefused --retry-delay 3 http://127.0.0.1:18789/
        timeout-minutes: 16

      - name: Reconfigure OpenRouter through the setup API and require a restarted, ready gateway
        run: |
          before="$(systemctl show -p ActiveEnterTimestampMonotonic --value sovereign-openclaw-gateway.service)"
          sudo env "PATH=$PATH" bash "$WEB_E2E" reconfigure-openrouter openrouter/ci-web-reconfigure-probe /tmp/web-reconfigure.json
          jq -e '
            .result.gateway.ready == true
            and ([.result.validation[] | select(.id == "openclaw-gateway-restart" and .status == "pass")] | length) == 1
          ' /tmp/web-reconfigure.json > /dev/null
          after="$(systemctl show -p ActiveEnterTimestampMonotonic --value sovereign-openclaw-gateway.service)"
          echo "gateway unit entered active at ${before} before and ${after} after the reconfigure"
          test "$after" -gt "$before"
          curl -s -o /dev/null --max-time 5 --retry 10 --retry-connrefused --retry-delay 3 http://127.0.0.1:18789/
        timeout-minutes: 12

      # Callers hold the token they read before; re-renders must not rotate it.
      - name: Verify the re-run and the reconfigure kept the gateway token
        run: |
          sudo env "PATH=$PATH" GITHUB_ACTIONS="$GITHUB_ACTIONS" bash scripts/ci/verify-gateway-auth.sh unchanged /tmp/gateway-token.sha256
          sudo env "PATH=$PATH" GITHUB_ACTIONS="$GITHUB_ACTIONS" bash scripts/ci/verify-gateway-auth.sh check

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== final install job ==="
          jq . /tmp/web-install-job.json 2>/dev/null || true
          jq . /tmp/web-reconfigure.json 2>/dev/null || true
          echo "=== API service ==="
          sudo systemctl status --no-pager sovereign-node-api.service 2>&1 || true
          sudo journalctl -u sovereign-node-api.service -n 400 --no-pager 2>&1 || true
          echo "=== sovereign-node status ==="
          sudo env "PATH=$PATH" sovereign-node status --json 2>&1 || true
          echo "=== gateway and scan units ==="
          sudo cat /etc/systemd/system/sovereign-openclaw-gateway.service 2>/dev/null || true
          sudo systemctl status --no-pager sovereign-openclaw-gateway.service 2>&1 || true
          sudo journalctl -u sovereign-openclaw-gateway.service -n 300 --no-pager 2>&1 || true
          sudo journalctl -u sovereign-mail-sentinel-scan.service -n 100 --no-pager 2>&1 || true
          echo "=== OpenClaw home ownership ==="
          sudo find /var/lib/sovereign-node/openclaw-home -maxdepth 3 -printf '%u:%g %m %TY-%Tm-%TdT%TH:%TM:%TS %p\n' 2>&1 | sort -k3 || true
          echo "=== docker compose logs ==="
          COMPOSE_DIR=$(find /etc/sovereign-node -name compose.yaml -exec dirname {} \; 2>/dev/null | head -1)
          if [ -n "$COMPOSE_DIR" ]; then
            cd "$COMPOSE_DIR" && docker compose logs --tail=100 2>&1 || true
          fi

  # Upgrade in place from the previous published release to this change, the
  # path an installed node takes with `sovereign-node update`. Proves that the
  # bundled Synapse migrates its existing database, keeps rooms and history,
  # and still delivers alerts before a release built from this change ships.
  # The update keeps the OpenClaw the previous release installed: only the
  # staged OpenClaw migration moves a node to another OpenClaw version.
  e2e_upgrade:
    name: E2E Upgrade (previous release to this change)
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    needs: [test, changes]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (needs.changes.outputs.install_relevant == 'true' &&
       github.event.pull_request.draft == false)
    env:
      PREVIOUS_RELEASE: v2.12.2
      PREVIOUS_DIR: /tmp/previous-release
      UPGRADE_DIR: /tmp/upgrade-e2e
      UPGRADE_HELPER: scripts/e2e/synapse-upgrade-e2e.sh
      # Warn once the measured migration comes this close to the readiness
      # deadline a real update would enforce.
      MIGRATION_WARN_MARGIN_SECONDS: "300"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Unit-test the upgrade helpers
        run: bash scripts/e2e/test-synapse-upgrade-e2e.sh

      # The tag's commit must be the one its published release was built from.
      - name: Fetch the previous release
        run: |
          git clone --depth 1 --branch "$PREVIOUS_RELEASE" \
            https://github.com/ndee/sovereign-ai-node "$PREVIOUS_DIR"
          mkdir -p "$UPGRADE_DIR"
          curl -fsSL -o "$UPGRADE_DIR/component-release.json" \
            "https://github.com/ndee/sovereign-ai-node/releases/download/${PREVIOUS_RELEASE}/component-release.json"
          jq . "$UPGRADE_DIR/component-release.json"
          jq -e --arg tag "$PREVIOUS_RELEASE" --arg sha "$(git -C "$PREVIOUS_DIR" rev-parse HEAD)" \
            '.tag == $tag and .commitSha == $sha' "$UPGRADE_DIR/component-release.json" > /dev/null

          previous_image="$(bash "$UPGRADE_HELPER" expected-image "$PREVIOUS_DIR/src/system/matrix.ts")"
          expected_image="$(bash "$UPGRADE_HELPER" expected-image src/system/matrix.ts)"
          ready_timeout_ms="$(bash "$UPGRADE_HELPER" ready-timeout-ms src/system/matrix.ts)"
          echo "previous release Synapse image: $previous_image"
          echo "this change's Synapse image:    $expected_image"
          {
            echo "PREVIOUS_SYNAPSE_IMAGE=$previous_image"
            echo "EXPECTED_SYNAPSE_IMAGE=$expected_image"
            echo "UPGRADE_READY_TIMEOUT_MS=$ready_timeout_ms"
          } >> "$GITHUB_ENV"

      - name: Clone bot catalog repo
        run: |
          BOT_REF="${GITHUB_HEAD_REF:-main}"
          if git ls-remote --exit-code --heads https://github.com/ndee/sovereign-ai-bots "$BOT_REF" >/dev/null 2>&1; then
            git clone --depth 1 --branch "$BOT_REF" https://github.com/ndee/sovereign-ai-bots /tmp/sovereign-ai-bots
          else
            git clone --depth 1 https://github.com/ndee/sovereign-ai-bots /tmp/sovereign-ai-bots
          fi

      # Only the previous release's images: the new Synapse image is pulled by
      # the update itself, as it would be on an installed node.
      - name: Pre-pull Docker images
        run: |
          docker pull postgres:16-alpine &
          docker pull "$PREVIOUS_SYNAPSE_IMAGE" &
          wait

      - name: Install the previous release (install.sh, non-interactive)
        run: |
          cp "$PREVIOUS_DIR/test/fixtures/ci-install-request.json" /tmp/ci-install-request.json
          sudo env "PATH=$PATH" bash "$PREVIOUS_DIR/scripts/install.sh" \
            --source-dir "$PREVIOUS_DIR" \
            --bots-source-dir /tmp/sovereign-ai-bots \
            --request-file /tmp/ci-install-request.json \
            --install \
            --non-interactive
          # `sovereign-node update` re-runs the installer against the saved request.
          sudo test -s /etc/sovereign-node/install-request.json
        timeout-minutes: 15

      - name: Record the OpenClaw the previous release installed
        run: |
          previous_pin="$(sed -n 's/^export const SOVEREIGN_PINNED_OPENCLAW_VERSION = "\(.*\)";$/\1/p' \
            "$PREVIOUS_DIR/src/openclaw/bootstrap.ts")"
          sudo env "PATH=$PATH" sovereign-node doctor --json > "$UPGRADE_DIR/doctor-pre.json"
          installed="$(jq -r '.result.checks[] | select(.id == "openclaw-version-pin") | .details.detectedVersion // empty' \
            "$UPGRADE_DIR/doctor-pre.json")"
          echo "previous release pin: $previous_pin, installed OpenClaw: $installed"
          test -n "$previous_pin"
          test "$installed" = "$previous_pin"
          echo "PREVIOUS_OPENCLAW_VERSION=$installed" >> "$GITHUB_ENV"

      - name: Record the gateway token the previous release left in the config
        run: sudo env "PATH=$PATH" GITHUB_ACTIONS="$GITHUB_ACTIONS" bash scripts/ci/verify-gateway-auth.sh record "$UPGRADE_DIR/gateway-token.sha256"

      - name: Verify the previous release runs its Synapse
        run: |
          bash "$UPGRADE_HELPER" snapshot "$UPGRADE_DIR/pre.json"
          jq -e --arg img "$PREVIOUS_SYNAPSE_IMAGE" --arg v "$(bash "$UPGRADE_HELPER" image-version "$PREVIOUS_SYNAPSE_IMAGE")" \
            '.image == $img and .synapseVersion == $v and .dbSchemaVersion == .codeSchemaVersion' \
            "$UPGRADE_DIR/pre.json" > /dev/null

      - name: Create rooms and message history before the upgrade
        run: sudo env "PATH=$PATH" bash "$UPGRADE_HELPER" seed "$UPGRADE_DIR/state.json"

      - name: Build this change's bundled install.sh
        run: bash scripts/install/build.sh "$UPGRADE_DIR/install.sh"

      - name: Upgrade in place with sovereign-node update
        run: |
          bash "$UPGRADE_HELPER" run-update "$UPGRADE_DIR/install.sh" "$GITHUB_WORKSPACE" \
            /tmp/sovereign-ai-bots "$EXPECTED_SYNAPSE_IMAGE" "$UPGRADE_DIR/watch.json"
        timeout-minutes: 35

      - name: Record the Synapse migration duration
        id: migration
        run: |
          bash "$UPGRADE_HELPER" snapshot "$UPGRADE_DIR/post.json"
          bash "$UPGRADE_HELPER" report "$UPGRADE_DIR/watch.json" "$UPGRADE_READY_TIMEOUT_MS" \
            "$MIGRATION_WARN_MARGIN_SECONDS" "$UPGRADE_DIR/pre.json" "$UPGRADE_DIR/post.json"

      - name: Verify Synapse runs the pinned image on a migrated database
        run: |
          bash "$UPGRADE_HELPER" verify-image "$EXPECTED_SYNAPSE_IMAGE" \
            "$UPGRADE_DIR/pre.json" "$UPGRADE_DIR/post.json"

      # Every install job runs while the gateway is up, so an update must not
      # swap the OpenClaw version under it.
      - name: Verify the update kept the previous release's OpenClaw
        run: |
          sudo env "PATH=$PATH" sovereign-node doctor --json > "$UPGRADE_DIR/doctor-post.json"
          jq '.result.checks[] | select(.id == "openclaw-version-pin")' "$UPGRADE_DIR/doctor-post.json"
          installed="$(jq -r '.result.checks[] | select(.id == "openclaw-version-pin") | .details.detectedVersion // empty' \
            "$UPGRADE_DIR/doctor-post.json")"
          test "$installed" = "$PREVIOUS_OPENCLAW_VERSION"
          # The kept version is recorded as the configured one.
          jq -e '.result.checks[] | select(.id == "openclaw-version-pin") | .status == "pass"' \
            "$UPGRADE_DIR/doctor-post.json" > /dev/null
          echo "OPENCLAW_VERSION_AFTER_UPDATE=$installed" >> "$GITHUB_ENV"

      # Devices whose config already carries a gateway token keep exactly that
      # token: the bots and every other local caller still hold it.
      - name: Verify the update kept the gateway token
        run: sudo env "PATH=$PATH" GITHUB_ACTIONS="$GITHUB_ACTIONS" bash scripts/ci/verify-gateway-auth.sh unchanged "$UPGRADE_DIR/gateway-token.sha256"

      - name: Verify the pre-upgrade rooms and history are readable
        run: sudo env "PATH=$PATH" bash "$UPGRADE_HELPER" verify-history "$UPGRADE_DIR/state.json"

      - name: Verify a test alert reaches the operator as a mention
        run: sudo env "PATH=$PATH" bash "$UPGRADE_HELPER" verify-alert "$UPGRADE_DIR/state.json"

      # OpenClaw 2026.8 keeps its state in SQLite under the service home; a
      # root-created entry there stops the gateway. An earlier OpenClaw kept by
      # the update may never create that state dir.
      - name: Verify the OpenClaw state belongs to the service user
        if: startsWith(env.OPENCLAW_VERSION_AFTER_UPDATE, '2026.8.')
        run: sudo env "PATH=$PATH" bash scripts/ci/verify-openclaw-state-ownership.sh

      - name: Restart Synapse twice and require a clean start each time
        run: |
          bash "$UPGRADE_HELPER" restarts 2
          sudo env "PATH=$PATH" bash "$UPGRADE_HELPER" verify-history "$UPGRADE_DIR/state.json"

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== upgrade watcher ==="
          cat "$UPGRADE_DIR/watch.json" 2>/dev/null || true
          echo "=== snapshots ==="
          cat "$UPGRADE_DIR/pre.json" "$UPGRADE_DIR/post.json" 2>/dev/null || true
          echo "=== sovereign-node status ==="
          sudo env "PATH=$PATH" sovereign-node status --json 2>&1 || true
          echo "=== latest install job ==="
          job="$(sudo sh -c 'ls -t /var/lib/sovereign-node/install-jobs/*.json 2>/dev/null | head -n 1')"
          if [ -n "$job" ]; then
            sudo jq '.response.job | {state, steps: [.steps[] | {id, state}]}' "$job" || true
          fi
          echo "=== gateway unit ==="
          sudo systemctl status --no-pager sovereign-openclaw-gateway.service 2>&1 || true
          sudo journalctl -u sovereign-openclaw-gateway.service -n 300 --no-pager 2>&1 || true
          echo "=== OpenClaw home ownership ==="
          sudo find /var/lib/sovereign-node/openclaw-home -maxdepth 3 -printf '%u:%g %m %TY-%Tm-%TdT%TH:%TM:%TS %p\n' 2>&1 | sort -k3 || true
          echo "=== docker ps -a ==="
          docker ps -a || true
          echo "=== synapse logs ==="
          for c in $(docker ps -aq --filter label=com.docker.compose.service=synapse); do
            docker logs --tail 300 "$c" 2>&1 || true
          done

  # The release workflow consumes only successful push runs whose sentinel
  # passed. Keep this explicit instead of relying on the workflow's aggregate
  # conclusion: skipped jobs otherwise count as a successful workflow.
  release_gate:
    name: Release Gate
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs:
      - changes
      - lint
      - typecheck
      - test
      - integration_coverage
      - smoke
      - artifact_contract
      - host_resources_ansible
      - e2e_noninteractive
      - e2e_interactive
      - e2e_rerun_after_partial_failure
      - e2e_web_install
      - e2e_upgrade
    env:
      REQUIRED_RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Require every main validation job to pass
        run: |
          jq -e '
            length == 13 and
            all(.[]; .result == "success")
          ' <<<"$REQUIRED_RESULTS" >/dev/null || {
            echo "::error::A required main CI job failed, was cancelled, or was skipped."
            jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$REQUIRED_RESULTS"
            exit 1
          }
