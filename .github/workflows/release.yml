name: Release Please

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft or published tag to recover/verify (defaults to package version)
        required: false
        type: string

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Prepare and publish release
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.name == 'CI' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve successful main CI context
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            RUN_ID="$TRIGGER_RUN_ID"
            HEAD_SHA="$TRIGGER_HEAD_SHA"
          else
            HEAD_SHA="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
              --jq '.object.sha')"
            RUN_ID="$(gh api --paginate \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=completed&per_page=100" \
              --jq '.workflow_runs[]' |
              jq -sr \
                --arg repo "$GITHUB_REPOSITORY" \
                --arg sha "$HEAD_SHA" '
                  map(select(
                    .name == "CI" and
                    .path == ".github/workflows/ci.yml" and
                    .event == "push" and
                    .head_branch == "main" and
                    .head_sha == $sha and
                    .head_repository.full_name == $repo and
                    .status == "completed" and
                    .conclusion == "success"
                  )) |
                  if length == 0 then empty
                  else max_by([.run_attempt, .id]) | .id
                  end
                ')"
            [[ -n "$RUN_ID" ]] || {
              echo "::error::Current main $HEAD_SHA has no successful completed push CI run."
              exit 1
            }
          fi

          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::Invalid CI workflow run ID: $RUN_ID"
            exit 1
          }
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Invalid CI head SHA: $HEAD_SHA"
            exit 1
          }
          printf 'run_id=%s\nsha=%s\n' "$RUN_ID" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ci.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require successful CI for the exact current main
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ steps.ci.outputs.run_id }}
          CI_HEAD_SHA: ${{ steps.ci.outputs.sha }}
        run: bash scripts/release/require-successful-main-ci.sh "$CI_RUN_ID" "$CI_HEAD_SHA"

      - name: Require release automation token
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [[ -z "$RELEASE_PLEASE_TOKEN" ]]; then
            echo "::error::RELEASE_PLEASE_TOKEN is required so generated PRs trigger required CI."
            exit 1
          fi

      - name: Revalidate current main before release automation
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ steps.ci.outputs.run_id }}
          CI_HEAD_SHA: ${{ steps.ci.outputs.sha }}
        run: bash scripts/release/require-successful-main-ci.sh "$CI_RUN_ID" "$CI_HEAD_SHA"

      - name: Open or advance the release PR
        id: release
        if: github.event_name == 'workflow_run'
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Revalidate current main after release automation
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ steps.ci.outputs.run_id }}
          CI_HEAD_SHA: ${{ steps.ci.outputs.sha }}
        run: bash scripts/release/require-successful-main-ci.sh "$CI_RUN_ID" "$CI_HEAD_SHA"

      # A failed build leaves a draft. Later main pushes may repair that draft,
      # while workflow_dispatch can also re-verify an already-published release.
      - name: Resolve release state and immutable tag
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          CI_HEAD_SHA: ${{ steps.ci.outputs.sha }}
          RECOVERY_TAG: ${{ inputs.tag }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_CREATED" == "true" ]]; then
            TAG="$RELEASE_TAG"
          elif [[ -n "$RECOVERY_TAG" ]]; then
            TAG="$RECOVERY_TAG"
          else
            VERSION="$(jq -r '.version' package.json)"
            TAG="v$VERSION"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag: $TAG"
            exit 1
          fi

          set +e
          RELEASE_JSON="$(bash scripts/release/find-github-release.sh "$TAG")"
          LOOKUP_STATUS=$?
          set -e
          if [[ "$LOOKUP_STATUS" != "0" ]]; then
            if [[ "$LOOKUP_STATUS" == "4" && \
                  ("$RELEASE_CREATED" == "true" || "$EVENT_NAME" == "workflow_dispatch") ]]; then
              echo "::error::Release $TAG does not exist."
              exit 1
            fi
            if [[ "$LOOKUP_STATUS" == "4" ]]; then
              echo 'process=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Failed to resolve release $TAG (lookup exit $LOOKUP_STATUS)."
            exit "$LOOKUP_STATUS"
          fi

          RELEASE_ID="$(jq -r '.id' <<<"$RELEASE_JSON")"
          IS_DRAFT="$(jq -r '.draft' <<<"$RELEASE_JSON")"
          TARGET_COMMITISH="$(jq -r '.target_commitish' <<<"$RELEASE_JSON")"
          if [[ "$IS_DRAFT" != "true" && "$IS_DRAFT" != "false" ]]; then
            echo "::error::Invalid draft state for $TAG: $IS_DRAFT"
            exit 1
          fi
          if [[ ! "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid GitHub Release ID for $TAG: $RELEASE_ID"
            exit 1
          fi
          if [[ ! "$TARGET_COMMITISH" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid release target for $TAG: $TARGET_COMMITISH"
            exit 1
          fi
          if [[ "$RELEASE_CREATED" == "true" && "$IS_DRAFT" != "true" ]]; then
            echo "::error::Release Please did not create $TAG as a draft."
            exit 1
          fi
          if [[ "$RELEASE_CREATED" == "true" && "$RELEASE_SHA" != "$CI_HEAD_SHA" ]]; then
            echo "::error::Release Please created $TAG for $RELEASE_SHA, not validated main $CI_HEAD_SHA."
            exit 1
          fi
          if [[ "$EVENT_NAME" == "workflow_run" && "$RELEASE_CREATED" != "true" && "$IS_DRAFT" != "true" ]]; then
            echo 'process=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch origin main --tags --force
          TAG_SHA="$(git rev-list -n 1 "$TAG")"
          if [[ "$TARGET_COMMITISH" != "$TAG_SHA" ]]; then
            echo "::error::Release $TAG targets $TARGET_COMMITISH but its tag resolves to $TAG_SHA."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TAG_SHA" origin/main; then
            echo "::error::Release tag $TAG ($TAG_SHA) is not an ancestor of main."
            exit 1
          fi
          if [[ "$RELEASE_CREATED" == "true" && "$TAG_SHA" != "$RELEASE_SHA" ]]; then
            echo "::error::Release Please reported $RELEASE_SHA but $TAG resolves to $TAG_SHA."
            exit 1
          fi
          printf 'process=true\ndraft=%s\ntag=%s\nsha=%s\nrelease_id=%s\n' \
            "$IS_DRAFT" "$TAG" "$TAG_SHA" "$RELEASE_ID" >> "$GITHUB_OUTPUT"

      # Recovery checks out the older release commit below. Preserve the current
      # draft-aware control scripts so verification does not regress with it.
      - name: Stage current release verification tooling
        if: steps.resolve.outputs.process == 'true'
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          TOOL_DIR="$RUNNER_TEMP/release-tooling"
          install -d -m 0755 "$TOOL_DIR"
          install -m 0755 \
            scripts/release/find-github-release.sh \
            scripts/release/require-successful-main-ci.sh \
            scripts/release/verify-github-assets.sh \
            "$TOOL_DIR/"

      - name: Check out the release commit
        if: steps.resolve.outputs.process == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        if: steps.resolve.outputs.process == 'true'
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        if: steps.resolve.outputs.process == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Frozen dependency install
        if: steps.resolve.outputs.process == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build exact release assets
        if: steps.resolve.outputs.process == 'true' && steps.resolve.outputs.draft == 'true'
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
          RELEASE_SHA: ${{ steps.resolve.outputs.sha }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          ARTIFACT_DIR="$RUNNER_TEMP/sovereign-node-release"
          bash scripts/release/build-node-artifacts.sh "$ARTIFACT_DIR" "$RELEASE_TAG" "$RELEASE_SHA"

      - name: Download published assets for recovery verification
        if: steps.resolve.outputs.process == 'true' && steps.resolve.outputs.draft != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          ARTIFACT_DIR="$RUNNER_TEMP/sovereign-node-release"
          install -d -m 0755 "$ARTIFACT_DIR"
          gh release download "$RELEASE_TAG" --dir "$ARTIFACT_DIR"
          EXPECTED_NAMES=(
            component-release.json
            install.sh
            "sovereign-ai-node-${RELEASE_TAG#v}.tgz"
          )
          mapfile -t ACTUAL_NAMES < <(
            find "$ARTIFACT_DIR" -mindepth 1 -maxdepth 1 -printf '%f\n' |
              LC_ALL=C sort
          )
          if [[ "$(printf '%s\n' "${ACTUAL_NAMES[@]}")" != "$(printf '%s\n' "${EXPECTED_NAMES[@]}")" ]]; then
            echo "::error::Published release asset names do not match the required set."
            printf 'expected: %s\n' "${EXPECTED_NAMES[*]}" >&2
            printf 'actual: %s\n' "${ACTUAL_NAMES[*]}" >&2
            exit 1
          fi
          [[ -f "$ARTIFACT_DIR/install.sh" ]] || {
            echo "::error::Published release is missing install.sh."
            exit 1
          }
          chmod 0755 "$ARTIFACT_DIR/install.sh"

      - name: Test exact release assets
        if: steps.resolve.outputs.process == 'true'
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
          RELEASE_SHA: ${{ steps.resolve.outputs.sha }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          bash scripts/release/test-node-artifacts.sh \
            "$RUNNER_TEMP/sovereign-node-release" "$RELEASE_TAG" "$RELEASE_SHA"

      - name: Require immutable releases
        if: steps.resolve.outputs.process == 'true' && steps.resolve.outputs.draft == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/immutable-releases" \
            --jq 'select(.enabled == true) | .enabled' |
            grep -qx true

      - name: Attach all assets to the draft
        if: steps.resolve.outputs.process == 'true' && steps.resolve.outputs.draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          CI_RUN_ID: ${{ steps.ci.outputs.run_id }}
          CI_HEAD_SHA: ${{ steps.ci.outputs.sha }}
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          bash "$RUNNER_TEMP/release-tooling/require-successful-main-ci.sh" \
            "$CI_RUN_ID" "$CI_HEAD_SHA"
          GH_TOKEN="$RELEASE_PLEASE_TOKEN" gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/sovereign-node-release"/* --clobber

      - name: Verify complete draft on GitHub
        if: steps.resolve.outputs.process == 'true' && steps.resolve.outputs.draft == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
          RELEASE_SHA: ${{ steps.resolve.outputs.sha }}
          RELEASE_ID: ${{ steps.resolve.outputs.release_id }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          ARTIFACT_DIR="$RUNNER_TEMP/sovereign-node-release"
          bash "$RUNNER_TEMP/release-tooling/verify-github-assets.sh" \
            draft "$RELEASE_TAG" "$RELEASE_SHA" "$RELEASE_ID" \
            "$ARTIFACT_DIR/component-release.json" \
            "$ARTIFACT_DIR/install.sh" \
            "$ARTIFACT_DIR/sovereign-ai-node-${RELEASE_TAG#v}.tgz"

      - name: Publish the immutable release
        if: steps.resolve.outputs.process == 'true' && steps.resolve.outputs.draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          CI_RUN_ID: ${{ steps.ci.outputs.run_id }}
          CI_HEAD_SHA: ${{ steps.ci.outputs.sha }}
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          # Keep this check in the publishing step so no queued stale run can
          # cross a step boundary and make an immutable release public.
          bash "$RUNNER_TEMP/release-tooling/require-successful-main-ci.sh" \
            "$CI_RUN_ID" "$CI_HEAD_SHA"
          if [[ "$RELEASE_TAG" == *-* ]]; then
            GH_TOKEN="$RELEASE_PLEASE_TOKEN" gh release edit \
              "$RELEASE_TAG" --draft=false --prerelease
          else
            GH_TOKEN="$RELEASE_PLEASE_TOKEN" gh release edit \
              "$RELEASE_TAG" --draft=false --latest
          fi

      - name: Verify published release metadata and assets
        if: steps.resolve.outputs.process == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
          RELEASE_SHA: ${{ steps.resolve.outputs.sha }}
          RELEASE_ID: ${{ steps.resolve.outputs.release_id }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          ARTIFACT_DIR="$RUNNER_TEMP/sovereign-node-release"
          bash "$RUNNER_TEMP/release-tooling/verify-github-assets.sh" \
            published "$RELEASE_TAG" "$RELEASE_SHA" "$RELEASE_ID" \
            "$ARTIFACT_DIR/component-release.json" \
            "$ARTIFACT_DIR/install.sh" \
            "$ARTIFACT_DIR/sovereign-ai-node-${RELEASE_TAG#v}.tgz"

      - name: Verify release attestation and assets
        if: steps.resolve.outputs.process == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          ARTIFACT_DIR="$RUNNER_TEMP/sovereign-node-release"
          for attempt in $(seq 1 12); do
            if gh release verify "$RELEASE_TAG"; then
              break
            fi
            if [[ "$attempt" == "12" ]]; then
              echo "::error::Immutable release attestation was not available."
              exit 1
            fi
            sleep 5
          done
          for asset in "$ARTIFACT_DIR"/*; do
            gh release verify-asset "$RELEASE_TAG" "$asset"
          done
