name: Auto-merge release PR

# Removes the human merge from the release half of the chain: Release Please
# opens the version-bump PR, and this arms GitHub's native auto-merge on it so
# it lands as soon as the required checks pass.
#
# WHY NATIVE AUTO-MERGE HERE, AND NOT A POLLING GUARD.
# Where a branch is unprotected, nothing would stop a red merge and a workflow
# would have to poll CI itself. That is not the situation here:
#
#   * THIS repo has an active ruleset ("sovereign-rules") with
#     required_status_checks, `bypass_actors: []` and
#     `current_user_can_bypass: "never"`. GitHub itself refuses to merge until
#     every required context passes, for everyone, with no exceptions.
#
# So here the correct move is to hand the decision to the platform rather than
# reimplement it. `--auto` QUEUES the merge; GitHub performs it only when the
# ruleset is satisfied. If a required check fails, the PR simply stays open.
# That is strictly safer than any status polling this workflow could do,
# because it cannot race: there is no window between "we checked" and "we
# merged" for a new push to slip through.
#
# Crucially, `--admin` is NOT used. That flag is exactly the one that bypasses
# the required checks, and using it would turn this from "merge when green"
# into "merge regardless".
#
# SCOPE. Only the Release Please branch, matched by its exact head ref
# (`release-please--branches--main--components--sovereign-ai-node`). The title
# is not used as a signal, and neither is the author: Release Please
# authenticates with RELEASE_PLEASE_TOKEN, which acts as `ndee` — the same
# identity a human PR carries — so author cannot distinguish generated from
# hand-written. Every other PR in this repo is untouched by this workflow.
#
# UP TO DATE WITH MAIN. The ruleset does not require branches to be up to
# date, so GitHub would merge a release PR whose changelog predates newer main
# commits, and the release notes would miss them. The decision script arms the
# PR only while it is exactly Release Please's one commit on the current main,
# and every push to main re-runs it so a PR that fell behind is disarmed.
# Release Please rebuilds the PR on each validated main (`always-update` in
# release-please-config.json); that push re-runs this and re-arms it. A main
# push that lands while the release PR's last required check is finishing can
# still be merged past before the disarm runs; only the ruleset's "require
# branches to be up to date" setting closes that window, and it applies to
# every PR.
#
# The job checks out the base branch only (the default for
# pull_request_target and push) to run the trusted decision script; PR code
# is never checked out or executed.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

# Every arm/disarm decision for the release PR is serialized in one group, and
# each run re-reads the live state, so whichever run is last decides. Other
# PRs get their own group so they can never displace a queued release decision.
concurrency:
  group: >-
    ${{ (github.event_name == 'push' ||
         github.event.pull_request.head.ref ==
           'release-please--branches--main--components--sovereign-ai-node')
        && 'auto-merge-release-pr'
        || format('auto-merge-release-other-{0}', github.event.pull_request.number) }}
  cancel-in-progress: false

jobs:
  arm:
    name: Arm auto-merge on the release PR
    # Belt and braces: the ref is asserted here AND re-asserted from the API by
    # the script. This `if` is the cheap filter; the script is the one that
    # actually decides, because it reads the ref back from the API rather than
    # trusting event payload fields.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.head.ref ==
         'release-please--branches--main--components--sovereign-ai-node')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Arm or disarm auto-merge on the release PR
        env:
          GH_TOKEN: ${{ github.token }}
          # A PAT, not the built-in token: a merge performed by GITHUB_TOKEN
          # does not emit the push event that the Release Please workflow's
          # `workflow_run` trigger keys on, so the release would never publish.
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: bash scripts/release/auto-merge-release-pr.sh ${PR:+"$PR"}
