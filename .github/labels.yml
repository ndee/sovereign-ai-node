# Canonical issue-lifecycle labels (source of truth).
# Synced by .github/workflows/sync-labels.yml on every push to main that touches
# this file. The sync is NON-DESTRUCTIVE: it creates-or-updates only these labels
# and never deletes any label, so topic/priority labels are left untouched.
#
# These four model the issue lifecycle state machine. See docs/ISSUE_LIFECYCLE.md.
# Keep this file identical across the repos that share this lifecycle.
#
# Optional `renamed_from:` names the label's previous name. When the new name does
# not exist yet but the old one does, the sync RENAMES the old label in place, so
# every issue carrying it keeps it (under the new name). Once the new name exists,
# the field is inert. Retired labels are simply omitted — the sync never deletes
# them; remove them by hand once no issue carries them.

- name: "lifecycle:analysis"
  color: "C5DEF5"
  description: "Lifecycle: root cause being determined from evidence; not yet designed."

- name: "lifecycle:elaboration"
  color: "FBCA04"
  description: "Lifecycle: solution being elaborated into a plan; not yet approved."

- name: "lifecycle:ready"
  renamed_from: "lifecycle:elaboration-complete"
  color: "0E8A16"
  description: "Lifecycle: plan approved by a human; ready to implement."

- name: "lifecycle:merged"
  renamed_from: "lifecycle:testing"
  color: "5319E7"
  description: "Lifecycle: merged, awaiting a release. Requires a merged linked PR."
